<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MSME Working-Capital Arbiter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --cream: #FDFFF8; --ink: #151414; --grey: #5A5A5A;
    --hairline: rgba(21,20,20,.12);
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --ui: Inter, -apple-system, "Helvetica Neue", sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 50% 30%, #FDFFF8 55%, #F2F3EA 100%);
    font-family: var(--ui); color: var(--ink);
  }
  /* camera mode (#cam=1 / V): mid-tone studio backdrop so a filmed TV doesn't blow out —
     cream pods and cards read as bright objects instead of dissolving into white */
  body.cam {
    background: radial-gradient(120% 90% at 50% 30%, #B6B3A8 45%, #8F8C83 100%);
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

  /* top bar */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    display: flex; align-items: center; gap: 14px; padding: 0 20px;
    background: color-mix(in srgb, var(--cream) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--hairline);
    z-index: 24; /* V3: stays crisp above the company-board dim */
  }

  #topbar .brand { font-family: var(--serif); font-size: 21px; letter-spacing: .04em; }
  #topbar .brand .ver { font-size: 13px; letter-spacing: .16em; color: var(--grey); vertical-align: 3px; margin-left: 2px; }
  /* INDUSTRY PROFILE (12 Sep 2026): the demo company beside the brand */
  #topbar .tag {
    font-size: 11px; letter-spacing: .14em; color: var(--grey);
    border: 1px solid var(--hairline); border-radius: 99px; padding: 4px 10px;
  }
  #topbar .sp { flex: 1; }
  #clock { font-family: var(--serif); font-size: 20px; font-variant-numeric: tabular-nums; }

  #overviewBtn {
    position: fixed; top: 66px; left: 20px; z-index: 23; /* V3: above the dept board */
    font-family: var(--ui); font-size: 12px; letter-spacing: .1em;
    background: var(--ink); color: var(--cream); border: 0; border-radius: 99px;
    padding: 9px 16px; cursor: pointer; opacity: 0; transform: translateY(-6px);
    pointer-events: none; transition: all .4s var(--ease);
  }
  #overviewBtn.show { opacity: 1; transform: none; pointer-events: auto; }
  #overviewBtn:hover { background: #000; }
  #overviewBtn.right { left: auto; right: 448px; } /* rail on the left → button moves right, clear of the task panel */

  /* zoom controls — big, obvious, camera-friendly */
  #zoomCtl {
    position: fixed; right: 448px; bottom: 20px; z-index: 10; /* V3.3: left of the task panel */
    display: flex; flex-direction: column; gap: 6px;
  }
  #zoomCtl button {
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    background: color-mix(in srgb, var(--cream) 94%, transparent);
    border: 1px solid var(--hairline); color: var(--ink);
    font-size: 19px; line-height: 1;
    box-shadow: 0 8px 22px rgba(21,20,20,.12);
    transition: all .4s var(--ease);
  }
  #zoomCtl button:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }

  /* dept badges — zoom-out layer */
  .badge {
    position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
    background: color-mix(in srgb, var(--cream) 96%, transparent);
    border: 1px solid var(--hairline); border-radius: 16px;
    box-shadow: 0 12px 30px rgba(21,20,20,.10);
    padding: 12px 18px 10px; text-align: center; min-width: 138px;
    transition: box-shadow .4s var(--ease);
    will-change: transform, opacity;
  }
  .badge:hover { box-shadow: 0 16px 40px rgba(21,20,20,.16); }
  /* M4 thinking sweep: the dept the brain is "thinking about" glows in its chip colour */
  .badge.sweepglow {
    box-shadow: 0 0 0 1.5px var(--sw), 0 14px 44px -8px var(--sw), 0 12px 30px rgba(21,20,20,.10);
  }
  .badge .b-name {
    font-size: 11px; letter-spacing: .16em; color: var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .badge .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .badge .b-count { display: flex; align-items: baseline; justify-content: center; gap: 7px; margin-top: 3px; }
  .badge .b-num { font-family: var(--serif); font-size: 38px; line-height: 1.05; }
  .badge .b-lab { font-size: 9.5px; letter-spacing: .18em; color: var(--grey); }

  /* agent name pills — zoom-in layer; clickable → agent modal */
  .pill {
    position: absolute; left: 0; top: 0; display: none;
    background: color-mix(in srgb, var(--cream) 94%, transparent);
    border: 1px solid var(--hairline); border-radius: 99px;
    box-shadow: 0 6px 16px rgba(21,20,20,.10);
    padding: 4px 11px; font-size: 10.5px; letter-spacing: .09em; white-space: nowrap;
    will-change: transform, opacity;
    pointer-events: auto; cursor: pointer;
    transform-origin: 50% 100%;
    transition: box-shadow .4s var(--ease), border-color .4s var(--ease);
  }
  .pill:hover { border-color: var(--ink); box-shadow: 0 8px 22px rgba(21,20,20,.18); }
  .pill .star { color: #C8A438; margin-right: 4px; }

  /* MCP logo ring labels + click tooltip */
  /* top-bar connector strip — the demo hook: familiar brand logos ARE the header, with
     data beaming from them down into the departments */
  /* V3.5: inside a department the strip centres in the bar and names the dept it feeds */
  /* V3.1: a real server that is present but not usable — there, but grey, with a reason on hover */
  @keyframes tcin { to { opacity: 1; transform: none; } }
  @keyframes tpulse {
    45% { transform: scale(1.38); filter: drop-shadow(0 0 9px rgba(46,139,87,.7)); }
  }

  /* permanent connector wiring: one conduit per dept from the top bar to a pod port */
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* billboard metrics + approval row */
  .badge .b-metrics { margin-top: 7px; border-top: 1px solid var(--hairline); padding-top: 6px; }
  .badge .m-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 14px;
    padding: 1.5px 0;
  }
  .badge .m-lab { font-size: 8.5px; letter-spacing: .14em; color: var(--grey); }
  .badge .m-val { font-family: var(--serif); font-size: 16px; transition: color .4s var(--ease); }
  .badge .m-val.flash { animation: flashGreen 1.2s var(--ease); }

  /* ---------- DARK MODE (6 Sep 2026) — tokens first, then the surfaces that were hard-coded white ---------- */

    --cream: #15161A; --ink: #ECEAE3; --grey: #A3A098; --hairline: rgba(236,234,227,.14);

  body.dark .tp-chip.on { background: var(--ink); color: #15161A; border-color: var(--ink); }

  body.dark .tp-row.waiting, body.dark .tk.waiting, body.dark .m-appr { background: rgba(242,184,75,.12); }
  body.dark .tp-rep, body.dark .tp-act button, body.dark .mrt { border-color: var(--hairline); }
  body.dark .badge.sweepglow { box-shadow: 0 0 0 1.5px var(--sw), 0 14px 44px -8px var(--sw), 0 12px 30px rgba(0,0,0,.4); }

  body.dark #zoomCtl button { background: #1E1F24; color: var(--ink); border-color: var(--hairline); }
  body.dark #zoomCtl button:hover { background: var(--ink); color: #15161A; }

  body.dark #wires path, body.dark #wires circle { filter: brightness(1.15); }
  body.dark #vignette { background: radial-gradient(ellipse at 50% 45%, transparent 32%, rgba(0,0,0,.6) 100%); }

  /* dept floor titles — screen-space, always horizontal (camera-readability rule) */

  /* ---------- MSME: top-bar numbers, proposals panel, audit and experiment views ---------- */
  #topmetrics { display: flex; gap: 6px; align-items: center; margin-right: 6px; }

  .tm.bad b { color: #B4391E; }
  .topbtn { font-family: var(--ui); font-size: 9px; letter-spacing: .14em; font-weight: 700; background: none; border: 1px solid var(--hairline); color: var(--grey); border-radius: 99px; padding: 6px 11px; cursor: pointer; }
  .topbtn:hover { border-color: var(--ink); color: var(--ink); }
  .pp-row { flex-wrap: wrap; }
  .tp-head { flex-wrap: wrap; gap: 4px 10px; }
  .pp-sel { font-family: var(--ui); font-size: 8.5px; letter-spacing: .08em; font-weight: 700; text-transform: uppercase; color: var(--ink); background: none; border: 1px solid var(--hairline); border-radius: 99px; padding: 4px 6px; max-width: 150px; }
  .pp-sel:hover { border-color: var(--ink); }
  .pp-num { width: 52px; font-family: var(--ui); font-size: 10px; font-weight: 700; border: 1px solid var(--hairline); border-radius: 99px; padding: 4px 8px; background: none; color: var(--ink); }
  .pp-btn { font-family: var(--ui); font-size: 8.5px; letter-spacing: .14em; font-weight: 700; background: none; border: 1px solid var(--hairline); color: var(--grey); border-radius: 99px; padding: 5px 9px; cursor: pointer; }
  .pp-btn:hover { border-color: var(--ink); color: var(--ink); }
  #tpanel.busy .pp-btn, #tpanel.busy .tp-add { opacity: .5; pointer-events: none; }
  .tp-row.pr { grid-template-columns: auto 1fr auto; cursor: pointer; }
  .tp-st.proposed { border-color: var(--ink); color: var(--ink); }
  .tp-st.arbitrating { border-color: #2E86AB; color: #2E86AB; font-weight: 600; }
  .tp-st.approved, .tp-st.executed { border-color: #1E9070; color: #1E9070; }
  .tp-st.modified { border-color: #A08A1E; color: #A08A1E; font-weight: 600; }
  .tp-st.rejected { border-color: #B4391E; color: #B4391E; }
  .tp-st.blocked { border-color: #B4830B; color: #B4830B; font-weight: 600; }
  .tp-row.pr.rejected, .tp-row.pr.blocked { background: #FFF8F3; }
  .tp-row.pr.blocked { border-color: rgba(180,131,11,.6); }
  .pp-why { font-size: 11px; line-height: 1.4; color: var(--ink); margin-top: 6px; text-transform: none; letter-spacing: 0; }
  .ov { position: fixed; inset: 0; z-index: 41; background: var(--cream); color: var(--ink); font-family: var(--ui); display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); }
  .ov.on { opacity: 1; pointer-events: auto; }
  .ov-band { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 22px; background: #151414; color: #FDFFF8; flex: none; }
  .ov-brand { font-family: var(--serif); font-size: 22px; letter-spacing: .05em; }
  .ov-brand small { font-family: var(--ui); font-size: 9.5px; letter-spacing: .18em; color: rgba(253,255,248,.55); margin-left: 12px; vertical-align: 3px; text-transform: uppercase; }
  .ov-band .sp { flex: 1; }
  .ov-sel, .ov-in { font-family: var(--ui); font-size: 11px; background: rgba(253,255,248,.08); color: #FDFFF8; border: 1px solid rgba(253,255,248,.2); border-radius: 99px; padding: 6px 12px; }
  .ov-in { width: 240px; } .ov-sel option { color: #151414; }
  .ov-link { font-size: 10px; letter-spacing: .1em; color: #FDFFF8; text-decoration: none; border: 1px solid rgba(253,255,248,.3); border-radius: 99px; padding: 6px 11px; }
  .ov-link:hover { background: rgba(253,255,248,.12); }
  .ov-x { background: none; border: 0; color: #FDFFF8; font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .ov-body { flex: 1; overflow-y: auto; padding: 18px 26px 40px; max-width: 1280px; width: 100%; margin: 0 auto; }
  .au-row { display: grid; grid-template-columns: 44px 150px 1.2fr 110px 110px 92px 1.6fr; gap: 10px; align-items: start; border-bottom: 1px solid var(--hairline); padding: 9px 2px; font-size: 12px; }
  .au-row.h { font-size: 9px; letter-spacing: .14em; color: var(--grey); font-weight: 700; text-transform: uppercase; position: sticky; top: -18px; background: var(--cream); padding-top: 14px; }
  .au-row .num { font-variant-numeric: tabular-nums; text-align: right; }
  .au-out { font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase; border: 1px solid; border-radius: 99px; padding: 2px 8px; justify-self: start; font-weight: 700; }
  .au-out.approved { color: #1E9070; } .au-out.modified { color: #A08A1E; } .au-out.rejected { color: #B4391E; }
  .au-dots { display: flex; gap: 3px; margin-top: 4px; }
  .au-dots i { width: 9px; height: 9px; border-radius: 50%; background: #1E9070; display: inline-block; }
  .au-dots i.f { background: #B4391E; }
  .au-sub { color: var(--grey); font-size: 10.5px; margin-top: 2px; }
  .au-empty, .ex-note { font-family: var(--serif); font-style: italic; color: var(--grey); padding: 28px 4px; font-size: 16px; }
  .ex-form { display: flex; flex-wrap: wrap; gap: 16px 26px; align-items: flex-end; border: 1px solid var(--hairline); border-radius: 14px; padding: 16px 18px; background: #fff; }
  .ex-form label { display: flex; flex-direction: column; gap: 5px; font-size: 9px; letter-spacing: .14em; font-weight: 700; color: var(--grey); text-transform: uppercase; }
  .ex-form input[type=number], .ex-form select { font-size: 12px; padding: 6px 9px; border: 1px solid var(--hairline); border-radius: 8px; width: 110px; background: var(--cream); color: var(--ink); }
  .ex-checks { display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 520px; }
  .ex-checks span { font-size: 11px; letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--ink); display: flex; gap: 5px; align-items: center; }
  .ex-go { font-family: var(--ui); font-size: 10px; letter-spacing: .14em; font-weight: 700; background: var(--ink); color: var(--cream); border: 0; border-radius: 99px; padding: 10px 18px; cursor: pointer; }
  .ex-go:disabled { opacity: .5; }
  .ex-bar { height: 6px; background: rgba(21,20,20,.09); border-radius: 99px; overflow: hidden; margin-top: 12px; } .ex-bar i { display: block; height: 100%; background: var(--ink); transition: width .3s; }
  .ex-table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .ex-table th { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--grey); text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--ink); }
  .ex-table th:first-child, .ex-table td:first-child, .ex-table th:nth-child(2), .ex-table td:nth-child(2) { text-align: left; }
  .ex-table td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--hairline); }
  .ex-table tr.arb td { font-weight: 600; background: rgba(46,134,171,.07); }
  .ex-table .ci { color: var(--grey); font-weight: 400; font-size: 10.5px; }
  .ex-h { font-family: var(--serif); font-size: 20px; margin: 26px 0 4px; }
  .ex-bars { display: grid; grid-template-columns: 170px 1fr 70px; gap: 6px 10px; align-items: center; font-size: 11px; margin-top: 8px; }
  .ex-bars .b { height: 12px; border-radius: 3px; }
  body.dark .ex-form { background: #1B1C21; }
  body.dark .ov-band { background: #0C0D10; }

  /* Phase B Client Dashboard */
  .view-switch { display: flex; background: rgba(21,20,20,.07); border-radius: 99px; padding: 3px; margin-left: 14px; }
  .vswitch-btn { font-family: var(--ui); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; border: 0; background: none; padding: 5px 14px; border-radius: 99px; cursor: pointer; color: var(--grey); transition: all .2s; }
  .vswitch-btn.on { background: var(--ink); color: var(--cream); }
  
  #clientDashboard { position: fixed; inset: 52px 0 0 0; background: var(--cream); z-index: 23; display: flex; flex-direction: column; overflow: hidden; }
  #clientDashboard.hide { display: none !important; }
  .cd-nav { display: flex; gap: 8px; padding: 12px 28px; border-bottom: 1px solid var(--hairline); background: color-mix(in srgb, var(--cream) 96%, transparent); }
  .cd-tab { font-family: var(--ui); font-size: 11px; letter-spacing: .08em; font-weight: 600; padding: 7px 16px; border: 1px solid var(--hairline); border-radius: 99px; background: none; cursor: pointer; color: var(--grey); transition: all .15s; }
  .cd-tab.on { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .cd-body { flex: 1; overflow-y: auto; padding: 24px 32px 60px; max-width: 1300px; width: 100%; margin: 0 auto; }
  .cd-section { display: flex; flex-direction: column; gap: 16px; }

  .cd-pill { font-size: 10px; font-weight: 700; letter-spacing: .1em; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--hairline); background: #fff; }
  .cd-pill.live { border-color: #1E9070; color: #1E9070; background: #EDFBF5; }
  .cd-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .cd-card { background: #fff; border: 1px solid var(--hairline); border-radius: 12px; padding: 16px 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
  .kpi-tag { display: flex; justify-content: space-between; align-items: center; }
  .kpi-label { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--grey); }
  .kpi-src { font-size: 8.5px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.06); font-weight: 600; color: var(--grey); }
  .kpi-val { font-family: var(--serif); font-size: 26px; color: var(--ink); font-weight: 600; margin: 6px 0 2px; }
  .kpi-sub { font-size: 11px; color: var(--grey); }
  .cd-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  .cd-table th { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--grey); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--ink); }
  .cd-table td { padding: 9px 10px; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
  .cd-btn-primary { font-family: var(--ui); font-size: 11px; font-weight: 600; letter-spacing: .08em; background: var(--ink); color: var(--cream); border: 0; border-radius: 99px; padding: 7px 14px; cursor: pointer; }
  .cd-btn-save { font-family: var(--ui); font-size: 11px; font-weight: 700; letter-spacing: .08em; background: #1E9070; color: #fff; border: 0; border-radius: 99px; padding: 9px 20px; cursor: pointer; }
  .cd-btn-run { font-family: var(--ui); font-size: 11px; font-weight: 700; letter-spacing: .1em; background: #2E86AB; color: #fff; border: 0; border-radius: 99px; padding: 10px 22px; cursor: pointer; }
  .cd-del-btn { font-size: 10px; border: 1px solid rgba(180,57,30,0.4); color: #B4391E; background: none; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  .due-tag { font-size: 10px; font-weight: 600; color: #2E86AB; background: rgba(46,134,171,0.1); padding: 2px 7px; border-radius: 99px; }
  .msme-badge { font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 99px; }

  .msme-badge.no { background: #F3F3F3; color: var(--grey); }
  .cd-empty { text-align: center; color: var(--grey); font-style: italic; padding: 32px 0; }

  .cd-decision-card.modified { border-left: 4px solid #A08A1E; }

  .d-top { display: flex; align-items: center; gap: 10px; }

  .d-action { font-weight: 600; font-size: 13px; }
  .d-src-badge { font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 99px; border: 1px solid; }
  .d-src-badge.llm { border-color: #2E86AB; color: #2E86AB; background: rgba(46,134,171,0.08); }
  .d-src-badge.rule { border-color: var(--grey); color: var(--grey); }
  .d-amt { font-family: var(--serif); font-size: 16px; font-weight: 600; }

  .d-bottom { display: flex; align-items: center; margin-top: 4px; }

  .d-status.modified { color: #A08A1E; }
  .d-status.rejected { color: #B4391E; }
  .d-status.blocked { color: #B4830B; }

  .btn-override-reject { font-size: 10.5px; font-weight: 700; background: #B4391E; color: #fff; border: 0; border-radius: 99px; padding: 4px 12px; cursor: pointer; }

<body>
<canvas id="scene"></canvas>
<div id="hud"></div>
<div id="topbar">
  <span class="brand">MSME WORKING-CAPITAL ARBITER <span class="ver">CAPSTONE</span></span>
  <div class="view-switch">
    <button id="viewBtnDash" class="vswitch-btn on">DASHBOARD</button>
    <button id="viewBtnOffice" class="vswitch-btn">OFFICE 3D</button>
  </div>
  <span class="sp"></span>
  <div id="topmetrics" title="the company's books, live from the simulator"></div>
  <button class="topbtn" id="topAudit" title="the audit log: every proposal, the constraints checked, the outcome and the reason (G)">AUDIT LOG</button>
  <button class="topbtn" id="topExp" title="run the experiments: seeds x scenarios x strategies (E)">EXPERIMENTS</button>
  <span id="clock">&mdash;</span>
</div>
<div id="vignette"></div>
<div id="rail" style="display:none">
  <div id="railDept" class="rview">
    <div id="railHeader"></div>
  <div id="railAgent" class="rview">
    <div class="mh">
      <button id="railBack">‹</button>
      <span class="mh-dot"></span>
      <div class="mh-t">
        <div class="mh-name"></div>
        <div class="mh-role"></div>
      </div>
    </div>
    <div class="mh-tag"></div>
    <div id="mRt" class="mrt" hidden></div>
    <div class="mtabs">
      <button data-tab="chat" class="on">CHAT</button>
      <button data-tab="activity">ACTIVITY</button>
    </div>
    <div id="mChat" class="mpane">
      <div id="mMsgs"></div>
      <div id="mChips"></div>
      <div class="mInput">
        <input id="mIn" placeholder="Ask this agent about its proposals…" autocomplete="off">
        <button id="mSend">SEND</button>
      </div>
    </div>
    <div id="mAct" class="mpane" style="display:none">
      <div id="mNow"></div>
      <div id="mStats"></div>
      <div id="mChart"><div class="ch-lbl"></div><div class="ch-bars"></div></div>
      <div id="mFeed"></div>
    </div>
  </div>
  </div>
</div>
<button id="overviewBtn">◂ OVERVIEW</button>
<!-- the audit-log view (G) -->
<div id="auditOv" class="ov">
  <div class="ov-band"><span class="ov-brand">AUDIT LOG <small id="auditMeta"></small></span><span class="sp"></span>
    <select id="auditOutcome" class="ov-sel"><option value="">All outcomes</option><option value="approved">Approved</option><option value="modified">Modified</option><option value="rejected">Rejected</option></select>
    <input id="auditSearch" class="ov-in" placeholder="Search agent, action, reason..." autocomplete="off" spellcheck="false">
    <button class="ov-x" id="auditClose" title="close (Esc)">&#10005;</button></div>
  <div class="ov-body"><div id="auditRows"></div></div>
</div>
<!-- the experiment-results view (E) -->
<div id="expOv" class="ov">
  <div class="ov-band"><span class="ov-brand">EXPERIMENTS <small id="expMeta"></small></span><span class="sp"></span>
    <a class="ov-link" id="expCsv" href="/api/msme/export/csv" download>results.csv</a><a class="ov-link" id="expJson" href="/api/msme/export/json" download>results.json</a>
    <button class="ov-x" id="expClose" title="close (Esc)">&#10005;</button></div>
  <div class="ov-body"><div id="expForm"></div><div id="expOut"></div></div>
</div>
<!-- the proposals panel: a task is a proposal -->
<div id="tpanel">
  <div class="tp-cmd">
    <div class="tp-r1 pp-row">
      <select class="pp-strategy pp-sel" title="how the week's proposals become actions"></select>
      <input class="pp-seed pp-num" type="number" min="1" value="1" title="the simulation seed: the same seed always gives the same company">
      <button class="pp-reset pp-btn" title="start a new company with this strategy, agent type and seed">RESET</button>
    </div>
    <div class="tp-r2 pp-row">
      <select class="pp-inject pp-sel" title="a shock the agents cannot see coming; it hits the books in the next cycle"></select>
      <button class="pp-injbtn pp-btn">INJECT</button>
      <span class="sp"></span>
      <button class="pp-run tp-add" title="every agent proposes, the strategy decides, the approved actions run and the week advances">RUN DECISION CYCLE</button>
    </div>
  </div>
  <div class="tp-hint"></div>
  <div class="tp-head"><span class="tp-lab">PROPOSALS <span class="tp-mode" hidden></span></span><span class="tp-scope">WHOLE COMPANY</span></div>
  <div class="tp-chips"></div>
  <div class="tp-rows"></div>
</div>

<!-- Client Dashboard View (Phase B) -->
<div id="clientDashboard">
  <div class="cd-nav">
    <button class="cd-tab on" data-tab="overview">OVERVIEW</button>
    <button class="cd-tab" data-tab="ar">RECEIVABLES (AR)</button>
    <button class="cd-tab" data-tab="ap">PAYABLES (AP)</button>
